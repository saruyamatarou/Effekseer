[project]
name = "effekseer-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kiharu Shishikura", email = "39523520+saruyamatarou@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
effekseer-mcp = "effekseer_mcp:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
bundle = ["pyinstaller>=6.0,<7"]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
